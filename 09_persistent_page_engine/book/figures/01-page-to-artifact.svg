<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="t d">
<title id="t">Experiment 09 page-to-artifact execution path</title><desc id="d">A full document page becomes layout regions, recognition requests, decoded crop text, an assembled page, and durable artifacts.</desc><rect x="0" y="0" width="2000" height="1000" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:22px;font-weight:700}.s{font-size:15px}.n{font-size:17px;font-weight:700}.box{stroke:#40516b;stroke-width:2;rx:14}.cpu{fill:#edf3f8}.npu{fill:#fff0d9}.data{fill:#fff}.out{fill:#e7f6ec}.line{stroke:#1d7b86;stroke-width:4;fill:none;marker-end:url(#a)}.label{font-size:14px;fill:#506078}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#1d7b86"/></marker></defs>
<text x="40" y="42" class="h">Experiment 09: one page’s data journey</text>
<rect x="32" y="82" width="230" height="300" class="box cpu"/><text x="55" y="118" class="n">CPU / PaddleX frontend</text><rect x="58" y="150" width="178" height="70" class="box data"/><text x="77" y="180" class="n">Full PIL page</text><text x="77" y="204" class="s">RGB image</text><rect x="58" y="260" width="178" height="88" class="box data"/><text x="77" y="290" class="n">Layout regions</text><text x="77" y="316" class="s">crop + prompt + order</text>
<rect x="318" y="82" width="245" height="300" class="box cpu"/><text x="342" y="118" class="n">Run-scoped scheduler</text><rect x="344" y="166" width="194" height="76" class="box data"/><text x="365" y="198" class="n">RecognitionRequest</text><text x="365" y="222" class="s">not page-batched</text><rect x="344" y="278" width="194" height="50" class="box data"/><text x="365" y="309" class="n">Ready reservoir</text>
<rect x="620" y="82" width="245" height="300" class="box npu"/><text x="646" y="118" class="n">Ascend NPU:0</text><rect x="646" y="158" width="193" height="65" class="box data"/><text x="668" y="188" class="n">Vision + text prefill</text><rect x="646" y="270" width="193" height="65" class="box data"/><text x="668" y="300" class="n">Persistent decode</text>
<rect x="923" y="82" width="205" height="300" class="box cpu"/><text x="946" y="118" class="n">Page collector</text><rect x="949" y="180" width="153" height="75" class="box data"/><text x="970" y="212" class="n">Crop result</text><text x="970" y="236" class="s">text + identity</text><rect x="949" y="290" width="153" height="46" class="box data"/><text x="970" y="319" class="n">Ordered page</text>
<rect x="1186" y="82" width="220" height="300" class="box out"/><text x="1210" y="118" class="n">Durable output</text><rect x="1212" y="190" width="168" height="80" class="box data"/><text x="1231" y="222" class="n">Background writer</text><text x="1231" y="246" class="s">Markdown + JSONL</text>
<path d="M147 220V260" class="line"/><path d="M262 304H318" class="line"/><path d="M563 204H620" class="line"/><path d="M742 223V270" class="line"/><path d="M865 303H923" class="line"/><path d="M1128 313H1186" class="line"/><text x="272" y="180" class="label">cross-page requests</text><text x="874" y="280" class="label">completion route</text>
