<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="t d"><title id="t">Page and request ownership boundaries</title><desc id="d">A page collector owns order and completion, while a continuous recognizer independently schedules crop requests.</desc><rect x="0" y="0" width="2000" height="1000" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:23px;font-weight:700}.n{font-size:18px;font-weight:700}.s{font-size:15px}.lane{stroke:#40516b;stroke-width:2;rx:18}.page{fill:#edf3f8}.req{fill:#fff0d9}.card{fill:#fff;stroke:#40516b;stroke-width:2;rx:12}.arrow{stroke:#1d7b86;stroke-width:4;fill:none;marker-end:url(#a)}.meta{stroke:#805ad5;stroke-width:3;stroke-dasharray:8 7;fill:none;marker-end:url(#p)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1d7b86"/></marker><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#805ad5"/></marker></defs><text x="40" y="44" class="h">Two lifecycles deliberately cross without becoming the same batch</text><rect x="32" y="78" width="1376" height="142" class="lane page"/><text x="56" y="112" class="n">Page lifecycle — owns document meaning</text><rect x="88" y="142" width="210" height="48" class="card"/><text x="115" y="173" class="n">Page P42 arrives</text><rect x="462" y="142" width="232" height="48" class="card"/><text x="492" y="173" class="n">Collector P42</text><rect x="1084" y="142" width="220" height="48" class="card"/><text x="1116" y="173" class="n">Emit page P42</text><path d="M298 166H462M694 166H1084" class="arrow"/><rect x="32" y="262" width="1376" height="150" class="lane req"/><text x="56" y="296" class="n">Request lifecycle — owns model work</text><rect x="165" y="330" width="190" height="48" class="card"/><text x="191" y="361" class="n">P42 / crop 1</text><rect x="442" y="330" width="190" height="48" class="card"/><text x="468" y="361" class="n">P17 / crop 3</text><rect x="719" y="330" width="190" height="48" class="card"/><text x="742" y="361" class="n">P42 / crop 2</text><rect x="996" y="330" width="190" height="48" class="card"/><text x="1026" y="361" class="n">decode slots</text><path d="M355 354H442M632 354H719M909 354H996" class="arrow"/><path d="M580 190V330M804 330V190" class="meta"/><text x="604" y="250" class="s" fill="#805ad5">page_id + reading order travel as metadata</text></svg>
