<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="t d"><title id="t">Layout region becomes recognition request</title><desc id="d">A full page is laid out, reading-ordered, cropped and prompt-routed into a recognition request.</desc><rect x="0" y="0" width="2000" height="1000" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:23px;font-weight:700}.n{font-size:18px;font-weight:700}.s{font-size:15px}.b{fill:#fff;stroke:#40516b;stroke-width:2;rx:13}.bg{fill:#edf3f8;stroke:#40516b;stroke-width:2;rx:16}.a{stroke:#1d7b86;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1d7b86"/></marker></defs><text x="40" y="44" class="h">Document semantics are converted into an independent recognition request</text><rect x="32" y="86" width="248" height="292" class="bg"/><text x="57" y="120" class="n">1 · Full page</text><rect x="69" y="157" width="170" height="176" class="b"/><text x="91" y="192" class="n">PIL.Image</text><rect x="92" y="218" width="120" height="35" fill="#cde9fa" stroke="#40516b"/><rect x="92" y="273" width="90" height="35" fill="#d8f1d5" stroke="#40516b"/><rect x="146" y="294" width="66" height="24" fill="#f9d5d3" stroke="#40516b"/><rect x="338" y="86" width="280" height="292" class="bg"/><text x="364" y="120" class="n">2 · PP-DocLayoutV3</text><rect x="365" y="160" width="224" height="146" class="b"/><text x="390" y="192" class="n">Regions</text><text x="390" y="222" class="s">label · score · polygon</text><text x="390" y="249" class="s">reading_order · box</text><rect x="676" y="86" width="280" height="292" class="bg"/><text x="703" y="120" class="n">3 · PaddleX routing</text><rect x="703" y="160" width="226" height="146" class="b"/><text x="730" y="192" class="n">Crop + prompt</text><text x="730" y="222" class="s">ordinary → OCR:</text><text x="730" y="249" class="s">table/chart/etc → policy</text><rect x="1014" y="86" width="370" height="292" class="bg"/><text x="1040" y="120" class="n">4 · RecognitionRequest</text><rect x="1040" y="155" width="318" height="166" class="b"/><text x="1067" y="188" class="n">identity</text><text x="1067" y="214" class="s">request_id · page_id · order</text><text x="1067" y="247" class="n">payload</text><text x="1067" y="273" class="s">PIL crop · prompt · stop policy</text><path d="M280 232H338M618 232H676M956 232H1014" class="a"/></svg>
