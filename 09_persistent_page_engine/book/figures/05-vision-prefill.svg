<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="t d"><title id="t">Vision prefill, in detail</title><desc id="d">CPU image preparation produces patch tensors, which transfer to the NPU for eager patch work, bucketed compiled vision encoding, crop splitting and eager projection.</desc><rect x="0" y="0" width="2000" height="1000" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:25px;font-weight:700}.n{font-size:18px;font-weight:700}.s{font-size:14px}.zone{stroke:#40516b;stroke-width:2;rx:18}.cpu{fill:#edf3f8}.npu{fill:#fff0d9}.card{fill:#fff;stroke:#40516b;stroke-width:2;rx:12}.model{fill:#dceafe;stroke:#40516b;stroke-width:2;rx:12}.data{fill:#fdfdfd;stroke:#40516b;stroke-width:2;rx:12}.a{stroke:#1d7b86;stroke-width:4;fill:none;marker-end:url(#m)}.event{stroke:#805ad5;stroke-width:3;stroke-dasharray:8 7;fill:none;marker-end:url(#p)}.red{fill:#fff0ee;stroke:#bf4b4b;stroke-width:2;rx:12}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1d7b86"/></marker><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#805ad5"/></marker></defs><text x="40" y="44" class="h">Vision prefill: raw crop → projector output</text><text x="40" y="72" class="s">Each card is one operation or data boundary; tensor symbols describe semantic dimensions, not an invented universal profile.</text><rect x="28" y="100" width="465" height="610" class="zone cpu"/><text x="55" y="136" class="n">CPU / pinned-host lane</text><rect x="60" y="170" width="190" height="105" class="card"/><text x="80" y="202" class="n">Recognition crop</text><text x="80" y="228" class="s">PIL RGB [H, W, 3]</text><rect x="290" y="170" width="170" height="105" class="card"/><text x="310" y="202" class="n">Preprocess</text><text x="310" y="228" class="s">resize · normalize</text><text x="310" y="248" class="s">patchify</text><rect x="60" y="350" width="190" height="155" class="data"/><text x="80" y="382" class="n">Vision tensors</text><text x="80" y="410" class="s">pixel_values</text><text x="80" y="431" class="s">[T, 3, 14, 14]</text><text x="80" y="461" class="s">image_grid_thw [1,3]</text><rect x="290" y="350" width="170" height="155" class="data"/><text x="310" y="382" class="n">Text-side inputs</text><text x="310" y="410" class="s">input_ids [1,S]</text><text x="310" y="431" class="s">position_ids [3,1,S]</text><text x="310" y="461" class="s">rope_deltas [1,1]</text><rect x="154" y="566" width="220" height="74" class="card"/><text x="177" y="598" class="n">Pinned H2D staging</text><text x="177" y="620" class="s">transfer stream + event</text><path d="M250 222H290M375 275V350M155 275V350M250 505V566M375 505V566" class="a"/><rect x="530" y="100" width="1042" height="610" class="zone npu"/><text x="557" y="136" class="n">Ascend NPU:0 — vision sub-pipeline</text><rect x="565" y="180" width="205" height="105" class="card"/><text x="587" y="212" class="n">H2D arrives</text><text x="587" y="236" class="s">real T patch rows</text><rect x="812" y="180" width="210" height="105" class="model"/><text x="835" y="212" class="n">Eager front-end</text><text x="835" y="236" class="s">patch embedding +</text><text x="835" y="256" class="s">position interpolation</text><rect x="1064" y="180" width="224" height="105" class="card"/><text x="1085" y="212" class="n">Shape selection</text><text x="1085" y="236" class="s">T → physical bucket</text><text x="1085" y="256" class="s">or eager overflow</text><rect x="1330" y="180" width="205" height="105" class="model"/><text x="1352" y="212" class="n">Vision tower</text><text x="1352" y="236" class="s">compiled TorchAir</text><text x="1352" y="256" class="s">static path</text><rect x="812" y="440" width="210" height="116" class="card"/><text x="835" y="472" class="n">Mask + split</text><text x="835" y="496" class="s">segment isolation</text><text x="835" y="516" class="s">remove dummy rows</text><rect x="1064" y="440" width="224" height="116" class="model"/><text x="1085" y="472" class="n">Eager projector</text><text x="1085" y="496" class="s">visual hidden →</text><text x="1085" y="516" class="s">text hidden space</text><rect x="1330" y="440" width="205" height="116" class="data"/><text x="1352" y="472" class="n">Per-crop output</text><text x="1352" y="496" class="s">visual embeddings</text><text x="1352" y="516" class="s">for image tokens</text><rect x="1064" y="605" width="224" height="60" class="red"/><text x="1085" y="641" class="n">Beyond retained graphs: eager overflow</text><path d="M493 603H565V232" class="a"/><path d="M770 232H812M1022 232H1064M1288 232H1330M1432 285V380H917V440M1022 498H1064M1288 498H1330" class="a"/><path d="M1176 285V605" class="event"/><text x="580" y="334" class="s">teal: payload transfer / data flow</text><text x="1088" y="582" class="s" fill="#805ad5">profile decision</text></svg>
