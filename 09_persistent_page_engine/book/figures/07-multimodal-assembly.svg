<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="t d"><title id="t">Multimodal embedding assembly</title><desc id="d">Token embeddings and projector outputs fill different positions of the same text-model input sequence.</desc><rect x="0" y="0" width="2000" height="1000" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:23px;font-weight:700}.n{font-size:18px;font-weight:700}.s{font-size:15px}.b{stroke:#40516b;stroke-width:2;rx:13}.d{fill:#fff}.blue{fill:#dceafe}.orange{fill:#fff0d9}.a{stroke:#1d7b86;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1d7b86"/></marker></defs><text x="40" y="44" class="h">Multimodal assembly: a text sequence whose positions come from two sources</text><rect x="45" y="102" width="300" height="108" class="b d"/><text x="70" y="136" class="n">Prompt token IDs</text><text x="70" y="163" class="s">OCR: + image placeholders</text><text x="70" y="188" class="s">input_ids [1,S]</text><rect x="45" y="278" width="300" height="108" class="b orange"/><text x="70" y="312" class="n">Vision projector outputs</text><text x="70" y="339" class="s">one vector per visual token</text><text x="70" y="364" class="s">[visual_tokens,H]</text><rect x="540" y="102" width="300" height="284" class="b d"/><text x="570" y="136" class="n">Eager assembly</text><text x="570" y="166" class="s">token embedding lookup</text><text x="570" y="194" class="s">scatter projector values at</text><text x="570" y="216" class="s">image-placeholder positions</text><rect x="574" y="255" width="55" height="52" class="b blue"/><rect x="636" y="255" width="55" height="52" class="b blue"/><rect x="698" y="255" width="55" height="52" class="b orange"/><rect x="760" y="255" width="55" height="52" class="b orange"/><rect x="822" y="255" width="55" height="52" class="b blue"/><text x="584" y="337" class="s">text / visual / text</text><rect x="1030" y="132" width="330" height="224" class="b blue"/><text x="1060" y="168" class="n">Text-prefill input</text><text x="1060" y="202" class="s">inputs_embeds [1,S,H]</text><text x="1060" y="236" class="s">position_ids [3,1,S]</text><text x="1060" y="264" class="s">attention mask + rope_deltas</text><text x="1060" y="303" class="s">now pixels are no longer needed</text><path d="M345 156H540M345 332H485V260H540M840 244H1030" class="a"/></svg>
