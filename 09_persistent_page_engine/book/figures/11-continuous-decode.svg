<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="t d"><title id="t">Persistent continuous decode arena</title><desc id="d">A fixed decoder batch repeatedly runs. Finished slots are retired and new ready requests are admitted in place without rebuilding other rows.</desc><rect x="0" y="0" width="2000" height="1000" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:23px;font-weight:700}.n{font-size:17px;font-weight:700}.s{font-size:14px}.b{stroke:#40516b;stroke-width:2;rx:12}.state{fill:#dbe8f7}.ready{fill:#e7f6ec}.dead{fill:#f6e5e5}.a{stroke:#1d7b86;stroke-width:4;fill:none;marker-end:url(#m)}.tick{stroke:#718096;stroke-width:2}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1d7b86"/></marker></defs><text x="40" y="44" class="h">Continuous decode: same graph shape, different occupants</text><text x="40" y="72" class="s">A row keeps its slot until EOS / length stop; a replacement uses that exact freed row.</text><rect x="44" y="105" width="180" height="345" class="b ready"/><text x="66" y="140" class="n">Ready reservoir</text><rect x="68" y="177" width="132" height="43" class="b state"/><text x="85" y="204" class="s">R27</text><rect x="68" y="238" width="132" height="43" class="b state"/><text x="85" y="265" class="s">R28</text><rect x="68" y="299" width="132" height="43" class="b state"/><text x="85" y="326" class="s">R29</text><text x="66" y="404" class="s">bounded</text><rect x="336" y="105" width="700" height="345" class="b state"/><text x="362" y="140" class="n">Fixed compiled decode arena</text><text x="362" y="167" class="s">next_token [B,1] · cache_position [B] · active_mask [B] · per-layer K/V [B,heads,L,head_dim]</text><line x1="490" y1="194" x2="490" y2="404" class="tick"/><line x1="675" y1="194" x2="675" y2="404" class="tick"/><line x1="860" y1="194" x2="860" y2="404" class="tick"/><text x="404" y="190" class="s">slot</text><text x="548" y="190" class="s">iteration k</text><text x="733" y="190" class="s">k+1</text><text x="918" y="190" class="s">k+2</text><text x="405" y="242" class="s">0</text><rect x="515" y="212" width="130" height="42" class="b ready"/><text x="536" y="239" class="s">R12 active</text><rect x="700" y="212" width="130" height="42" class="b ready"/><text x="721" y="239" class="s">R12 active</text><rect x="885" y="212" width="130" height="42" class="b ready"/><text x="906" y="239" class="s">R12 active</text><text x="405" y="301" class="s">i</text><rect x="515" y="271" width="130" height="42" class="b ready"/><text x="536" y="298" class="s">R13 active</text><rect x="700" y="271" width="130" height="42" class="b dead"/><text x="723" y="298" class="s">R13 EOS</text><rect x="885" y="271" width="130" height="42" class="b ready"/><text x="905" y="298" class="s">R27 admitted</text><text x="405" y="360" class="s">B−1</text><rect x="515" y="330" width="130" height="42" class="b ready"/><text x="536" y="357" class="s">R21 active</text><rect x="700" y="330" width="130" height="42" class="b ready"/><text x="721" y="357" class="s">R21 active</text><rect x="885" y="330" width="130" height="42" class="b ready"/><text x="906" y="357" class="s">R21 active</text><path d="M224 259H336" class="a"/><path d="M765 313V416H950V372" class="a"/><text x="774" y="441" class="s">retire → full-row KV copy → hot-swap same slot</text><rect x="1110" y="170" width="260" height="180" class="b state"/><text x="1134" y="206" class="n">D2H token path</text><text x="1134" y="238" class="s">sampled [B,1]</text><text x="1134" y="265" class="s">NPU stream → pinned</text><text x="1134" y="288" class="s">two-row host ring</text><text x="1134" y="316" class="s">→ detokenization</text><path d="M1036 250H1110" class="a"/></svg>
