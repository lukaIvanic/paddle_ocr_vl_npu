<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="t d"><title id="t">Result routing and page assembly</title><desc id="d">Out-of-order recognition completions return to the owning page collector, which assembles the page only after all required regions arrive.</desc><rect x="0" y="0" width="2000" height="1000" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:23px;font-weight:700}.n{font-size:18px;font-weight:700}.s{font-size:15px}.b{stroke:#40516b;stroke-width:2;rx:13}.d{fill:#fff}.state{fill:#dbe8f7}.out{fill:#e7f6ec}.a{stroke:#1d7b86;stroke-width:4;fill:none;marker-end:url(#m)}.p{stroke:#805ad5;stroke-width:3;stroke-dasharray:8 7;fill:none;marker-end:url(#q)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1d7b86"/></marker><marker id="q" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#805ad5"/></marker></defs><text x="40" y="44" class="h">Completion returns from model order to document order</text><rect x="48" y="123" width="265" height="216" class="b d"/><text x="75" y="160" class="n">RecognitionResult</text><text x="75" y="190" class="s">text tokens → string</text><text x="75" y="218" class="s">request_id + page_id</text><text x="75" y="246" class="s">region / reading order</text><text x="75" y="292" class="s">arrives when decode finishes</text><rect x="465" y="92" width="350" height="276" class="b state"/><text x="493" y="130" class="n">PageCollector for P42</text><rect x="500" y="170" width="270" height="48" class="b out"/><text x="525" y="201" class="s">order 0 · title ✓</text><rect x="500" y="229" width="270" height="48" class="b out"/><text x="525" y="260" class="s">order 1 · paragraph ✓</text><rect x="500" y="288" width="270" height="48" class="b d"/><text x="525" y="319" class="s">order 2 · table ✓ last</text><rect x="956" y="133" width="205" height="170" class="b out"/><text x="980" y="170" class="n">PaddleX assembly</text><text x="980" y="201" class="s">faithful block</text><text x="980" y="224" class="s">merge + Markdown</text><text x="980" y="255" class="s">page complete</text><rect x="1242" y="133" width="158" height="170" class="b out"/><text x="1264" y="170" class="n">Writer</text><text x="1264" y="201" class="s">ordered</text><text x="1264" y="224" class="s">bounded</text><text x="1264" y="255" class="s">durable</text><path d="M313 231H465M815 231H956M1161 218H1242" class="a"/><path d="M180 339V401H638V368" class="p"/><text x="268" y="427" class="s" fill="#805ad5">metadata selects the correct collector slot</text></svg>
