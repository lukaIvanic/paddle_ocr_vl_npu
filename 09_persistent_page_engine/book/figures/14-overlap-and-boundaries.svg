<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="t d"><title id="t">Experiment 09 overlap and backpressure boundaries</title><desc id="d">CPU work can overlap with NPU work, while the shared NPU serializes model execution. Queues limit accumulation.</desc><rect x="0" y="0" width="2000" height="1000" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:23px;font-weight:700}.n{font-size:18px;font-weight:700}.s{font-size:14px}.lane{stroke:#40516b;stroke-width:2;rx:13}.cpu{fill:#edf3f8}.npu{fill:#fff0d9}.io{fill:#e7f6ec}.queue{fill:#f1eafd;stroke:#805ad5;stroke-width:2;stroke-dasharray:7 5;rx:12}.bar{fill:#1d7b86}.bar2{fill:#e49a38}.dash{stroke:#805ad5;stroke-width:3;stroke-dasharray:8 7}.axis{stroke:#40516b;stroke-width:2}</style><text x="40" y="44" class="h">Overlap is controlled, not unlimited</text><line x1="235" y1="85" x2="1378" y2="85" class="axis"/><text x="1160" y="75" class="s">time →</text><rect x="34" y="112" width="180" height="92" class="lane cpu"/><text x="58" y="151" class="n">CPU preparation</text><text x="58" y="177" class="s">crop + prompt + tensors</text><rect x="34" y="226" width="180" height="92" class="lane npu"/><text x="58" y="265" class="n">Shared NPU</text><text x="58" y="291" class="s">layout + recognizer</text><rect x="34" y="340" width="180" height="92" class="lane io"/><text x="58" y="379" class="n">Writer / host</text><text x="58" y="405" class="s">artifacts + tokens</text><rect x="260" y="132" width="220" height="44" class="bar"/><text x="275" y="160" class="s" fill="#fff">prepare P42 crops</text><rect x="510" y="132" width="190" height="44" class="bar"/><text x="525" y="160" class="s" fill="#fff">prepare P43</text><rect x="750" y="132" width="210" height="44" class="bar"/><text x="765" y="160" class="s" fill="#fff">prepare P44</text><rect x="280" y="246" width="175" height="44" class="bar2"/><text x="300" y="274" class="s" fill="#fff">layout P42</text><rect x="470" y="246" width="235" height="44" class="bar2"/><text x="490" y="274" class="s" fill="#fff">vision/text prefill</text><rect x="720" y="246" width="335" height="44" class="bar2"/><text x="740" y="274" class="s" fill="#fff">persistent decode iterations</text><rect x="400" y="360" width="165" height="44" class="bar"/><text x="420" y="388" class="s" fill="#fff">write P41</text><rect x="900" y="360" width="170" height="44" class="bar"/><text x="920" y="388" class="s" fill="#fff">write P42</text><rect x="260" y="432" width="220" height="46" class="queue"/><text x="282" y="461" class="s">1-page frontend queue</text><rect x="700" y="432" width="235" height="46" class="queue"/><text x="720" y="461" class="s">bounded ready reservoir</text><line x1="370" y1="176" x2="370" y2="432" class="dash"/><line x1="820" y1="290" x2="820" y2="432" class="dash"/><text x="1088" y="264" class="s">No claim of concurrent model kernels:</text><text x="1088" y="286" class="s">layout and recognizer share NPU:0.</text></svg>
