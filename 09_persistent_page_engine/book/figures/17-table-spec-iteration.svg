<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="t d">
  <title id="t">One table speculative verification iteration</title>
  <desc id="d">A matcher finds a draft continuation from the target prefix and proposes K token IDs. The target model verifies all positions in one call, accepts the matching prefix, emits the authoritative target token at the first mismatch, and adapts K for the next call.</desc>
  <rect width="1440" height="660" fill="#fff"/>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#1d7b86"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#4a5568}
      .h{font-size:19px;font-weight:700}.n{font-size:15px;font-weight:700}.s{font-size:13px}.tiny{font-size:12px}
      .box{stroke:#40516b;stroke-width:2;rx:13}.cpu{fill:#edf3f8}.npu{fill:#fff0d9}.state{fill:#f1eafd}
      .tok{stroke:#40516b;stroke-width:1.5;rx:5}.prefix{fill:#dbe8f7}.proposal{fill:#bee3f8}.ok{fill:#c6f6d5}.bad{fill:#fed7d7}.bonus{fill:#fbd38d}
      .arrow{stroke:#1d7b86;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#805ad5;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="42" y="45" class="title">One verifier call can advance many authoritative output positions</text>
  <text x="42" y="72" class="sub">Example: K=8. Six draft IDs match; the seventh does not. The call commits seven output positions: six accepted IDs plus one target token.</text>

  <rect x="42" y="110" width="390" height="132" class="box cpu"/>
  <text x="64" y="142" class="h">1 · Match using only legal state</text>
  <text x="64" y="170" class="s">Input: generated target prefix + saved draft IDs</text>
  <text x="64" y="196" class="s">Find the longest useful exact suffix anchor.</text>
  <text x="64" y="220" class="s">Select one continuation; do not inspect future target IDs.</text>

  <rect x="486" y="110" width="415" height="132" class="box cpu"/>
  <text x="508" y="142" class="h">2 · Propose K draft IDs</text>
  <g transform="translate(508,165)">
    <rect x="0" y="0" width="40" height="40" class="tok proposal"/><rect x="45" y="0" width="40" height="40" class="tok proposal"/>
    <rect x="90" y="0" width="40" height="40" class="tok proposal"/><rect x="135" y="0" width="40" height="40" class="tok proposal"/>
    <rect x="180" y="0" width="40" height="40" class="tok proposal"/><rect x="225" y="0" width="40" height="40" class="tok proposal"/>
    <rect x="270" y="0" width="40" height="40" class="tok proposal"/><rect x="315" y="0" width="40" height="40" class="tok proposal"/>
    <text x="14" y="26" class="s">d₁</text><text x="59" y="26" class="s">d₂</text><text x="104" y="26" class="s">d₃</text><text x="149" y="26" class="s">d₄</text>
    <text x="194" y="26" class="s">d₅</text><text x="239" y="26" class="s">d₆</text><text x="284" y="26" class="s">d₇</text><text x="329" y="26" class="s">d₈</text>
  </g>

  <rect x="957" y="110" width="441" height="132" class="box npu"/>
  <text x="979" y="142" class="h">3 · One B1 target call over K+1 inputs</text>
  <text x="979" y="170" class="s">Input sequence: current target token, then d₁ … d₈.</text>
  <text x="979" y="196" class="s">The full-table model returns its token for each position.</text>
  <text x="979" y="220" class="s">Decoder weights are amortized across the verification block.</text>
  <path d="M432 176 H486" class="arrow"/><path d="M901 176 H957" class="arrow"/>

  <rect x="42" y="286" width="1356" height="178" class="box state"/>
  <text x="64" y="320" class="h">4 · Compare draft IDs with authoritative target IDs</text>
  <text x="64" y="354" class="n">draft</text><text x="64" y="411" class="n">target</text>
  <g transform="translate(154,332)">
    <rect x="0" y="0" width="60" height="42" class="tok proposal"/><rect x="68" y="0" width="60" height="42" class="tok proposal"/><rect x="136" y="0" width="60" height="42" class="tok proposal"/>
    <rect x="204" y="0" width="60" height="42" class="tok proposal"/><rect x="272" y="0" width="60" height="42" class="tok proposal"/><rect x="340" y="0" width="60" height="42" class="tok proposal"/>
    <rect x="408" y="0" width="60" height="42" class="tok bad"/><rect x="476" y="0" width="60" height="42" class="tok proposal"/>
    <text x="22" y="27" class="s">d₁</text><text x="90" y="27" class="s">d₂</text><text x="158" y="27" class="s">d₃</text><text x="226" y="27" class="s">d₄</text>
    <text x="294" y="27" class="s">d₅</text><text x="362" y="27" class="s">d₆</text><text x="430" y="27" class="s">d₇</text><text x="498" y="27" class="s">d₈</text>
    <rect x="0" y="58" width="60" height="42" class="tok ok"/><rect x="68" y="58" width="60" height="42" class="tok ok"/><rect x="136" y="58" width="60" height="42" class="tok ok"/>
    <rect x="204" y="58" width="60" height="42" class="tok ok"/><rect x="272" y="58" width="60" height="42" class="tok ok"/><rect x="340" y="58" width="60" height="42" class="tok ok"/>
    <rect x="408" y="58" width="60" height="42" class="tok bonus"/><rect x="476" y="58" width="60" height="42" fill="#fff" stroke="#a0aec0" stroke-width="1.5" rx="5"/>
    <text x="22" y="85" class="s">d₁</text><text x="90" y="85" class="s">d₂</text><text x="158" y="85" class="s">d₃</text><text x="226" y="85" class="s">d₄</text>
    <text x="294" y="85" class="s">d₅</text><text x="362" y="85" class="s">d₆</text><text x="428" y="85" class="s">t₇</text><text x="491" y="85" class="tiny">unused</text>
    <path d="M438 47 V54" stroke="#e53e3e" stroke-width="3"/>
  </g>
  <text x="750" y="359" class="s">green: accepted draft IDs</text>
  <text x="750" y="386" class="s">orange: first target mismatch token</text>
  <text x="750" y="413" class="s">later physical verifier slots are not committed</text>
  <text x="750" y="440" class="tiny">logical cache position advances by accepted + 1</text>

  <rect x="42" y="508" width="600" height="112" class="box cpu"/>
  <text x="64" y="540" class="h">5 · Commit output and update matcher state</text>
  <text x="64" y="568" class="s">Append d₁ … d₆, then t₇. Move the draft cursor to the accepted location.</text>
  <text x="64" y="594" class="s">If no reliable draft continuation exists, run one ordinary B1 decode step.</text>

  <rect x="700" y="508" width="698" height="112" class="box cpu"/>
  <text x="722" y="540" class="h">Optional adaptive K follow-up</text>
  <text x="722" y="568" class="s">Fully accepted call: K ← min(2K, 64). Rejected call: K ← max(K/2, 8).</text>
  <text x="722" y="594" class="s">Measured K set: 8, 16, 32, 64. The fixed-D16 runtime remains the best full-corpus P99 result so far.</text>
  <path d="M1160 508 V484 H352 V508" class="dash"/>
</svg>
